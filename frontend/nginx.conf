# Pooled keep-alive connections to FastAPI, so nginx is not opening a fresh TCP
# connection for every redirect.
upstream app {
  server backend:8000;
  keepalive 128;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /api/load-test { proxy_pass http://loadgen:9000/api/load-test; proxy_set_header Host $http_host; proxy_read_timeout 60s; }
  location /api/ { proxy_pass http://app/api/; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  location ~ "^/[A-Za-z0-9_-]{3,24}$" {
    # One access-log line per redirect, written through Docker's json-file driver, cost
    # more CPU than serving the request. Click history is in PostgreSQL, not this log.
    access_log off;
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { try_files $uri /index.html; }
}
